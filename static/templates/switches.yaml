- switch:
    - name: Barn AC Power
      default_entity_id: switch.barn_ac_power
      state: >
        {{ states('climate.garden_barn_ac') in ['heat','cool','heat_cool','fan_only','dry'] }}
      turn_on:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.garden_barn_ac
          data:
            hvac_mode: heat
      turn_off:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.garden_barn_ac
          data:
            hvac_mode: "off"
