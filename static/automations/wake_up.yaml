- alias: Wake up lights (Katie)
  mode: single
  trigger:
    - platform: time
      at: input_datetime.wake_up_katie
  condition:
    - alias: "Home"
      condition: state
      entity_id: person.katie
      state: home
    - alias: "Enabled"
      condition: state
      entity_id: input_boolean.wake_up_katie_enabled
      state: "on"
  action:
    - alias: "Turn on lamp"
      action: light.turn_on
      target:
        entity_id: light.bedroom_lamp_left
      data:
        brightness: 125

- alias: Wake up lights (Dan)
  mode: single
  trigger:
    - platform: time
      at: input_datetime.wake_up_dan
  condition:
    - alias: "Home"
      condition: state
      entity_id: person.dan
      state: home
    - alias: "Enabled"
      condition: state
      entity_id: input_boolean.wake_up_dan_enabled
      state: "on"
  action:
    - alias: "Set active room"
      action: input_select.select_option
      target:
        entity_id: input_select.active_room
      data:
        option: bedroom
    - alias: "Fully open curtains"
      repeat:
        for_each:
          - cover.curtains
          - cover.bedroom_bedroom_curtain_right
          - cover.office_curtain_left
          - cover.office_office_curtain_right
        sequence:
          - if:
              - condition: template
                value_template: "{{ state_attr(repeat.item, 'current_position') | float(100) < 100 }}"
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ repeat.item }}"
                data:
                  position: 100
