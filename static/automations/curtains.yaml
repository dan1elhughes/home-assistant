- alias: "Curtains closed at sunset"
  mode: single
  triggers:
    - trigger: sun
      event: sunset
  action:
    - action: cover.set_cover_position
      target:
        entity_id:
          - cover.bedroom_curtains
          - cover.office_curtains
          - cover.dining_room_curtains
      data:
        position: 0

- alias: "Bedroom curtains closed before dawn"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sun.sun
      attribute: elevation
      above: -6
  condition:
    - alias: "Home"
      condition: state
      entity_id: group.presence_home
      state: home
  action:
    - action: cover.set_cover_position
      target:
        entity_id: cover.bedroom_curtains
      data:
        position: 0

- alias: "Curtains open at 8am"
  mode: single
  triggers:
    - trigger: time
      at: "08:00:00"
  action:
    - action: cover.set_cover_position
      target:
        entity_id:
          - cover.bedroom_curtains
          - cover.office_curtains
          - cover.dining_room_curtains
      data:
        position: 100
