- alias: "Smart charge: keep battery charge back for the car"
  mode: single
  description: >-
    While the ID3 is smart charging on Octopus, keep some home battery charge
    in reserve so the car can still charge. Octopus can move the charging slot
    at short notice, in a window Predbat does not plan for, so the reserve
    minimum (the level the battery will not drop below while running) is what
    protects the car's charge. The keep target and its weight bias Predbat's
    longer-term plan in the run-up to the charging window. All three go back to
    their defaults when smart charge is off. There is no default action, so an
    unknown or unavailable state leaves the values alone.
  trigger:
    - platform: state
      entity_id: switch.octopus_energy_00000000_0002_4000_8020_00000008191c_intelligent_smart_charge
  action:
    choose:
      - conditions:
          - alias: "Smart charge is on"
            condition: state
            entity_id: switch.octopus_energy_00000000_0002_4000_8020_00000008191c_intelligent_smart_charge
            state: "on"
        sequence:
          - alias: "Hold the battery at 10% or more so the car can charge"
            action: input_number.set_value
            target:
              entity_id: input_number.predbat_set_reserve_min
            data:
              value: 10
          - alias: "Ask Predbat to plan to keep 1.5 kWh spare for the car"
            action: input_number.set_value
            target:
              entity_id: input_number.predbat_best_soc_keep
            data:
              value: 1.5
          - alias: "Make the keep target count fully while smart charge is on"
            action: input_number.set_value
            target:
              entity_id: input_number.predbat_best_soc_keep_weight
            data:
              value: 1
      - conditions:
          - alias: "Smart charge is off"
            condition: state
            entity_id: switch.octopus_energy_00000000_0002_4000_8020_00000008191c_intelligent_smart_charge
            state: "off"
        sequence:
          - alias: "Put the reserve back to the normal 5%"
            action: input_number.set_value
            target:
              entity_id: input_number.predbat_set_reserve_min
            data:
              value: 5
          - alias: "Stop keeping charge back for the car"
            action: input_number.set_value
            target:
              entity_id: input_number.predbat_best_soc_keep
            data:
              value: 0
          - alias: "Put the keep weight back to normal"
            action: input_number.set_value
            target:
              entity_id: input_number.predbat_best_soc_keep_weight
            data:
              value: 0.5
